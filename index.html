    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("./service-worker.js")

                    console.log("Service Worker registered");

                .catch((error) => {
                    console.error("Service Worker registration failed:", error);
                });
        });
